name: Continuous Integration & Security Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. DevSecOps: Secrets Scanning Gate (Gitleaks & TruffleHog)
  # ═══════════════════════════════════════════════════════════════════════════
  secrets-scan:
    name: Secrets & Credential Leak Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for deep leaks detection

      - name: Run Gitleaks Detector
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Run TruffleHog Filesystem Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified=false

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. Backend Gate: .NET 9 Build, Analysis & xUnit Tests
  # ═══════════════════════════════════════════════════════════════════════════
  backend-ci:
    name: Backend Build & Test (.NET 9)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore MiniGarage.sln

      - name: Build Solution
        run: dotnet build MiniGarage.sln --configuration Release --no-restore

      - name: Execute Backend Tests (xUnit)
        run: >
          dotnet test MiniGarage.sln
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. Frontend Gate: React 19, TypeScript & Vitest Suite
  # ═══════════════════════════════════════════════════════════════════════════
  frontend-ci:
    name: Frontend Quality & Vitest (React 19)
    runs-on: ubuntu-latest
    needs: secrets-scan
    defaults:
      run:
        working-directory: MiniGarage.Client
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: MiniGarage.Client/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify Type Integrity & Build
        run: npm run build

      - name: Run Frontend Tests with MSW (Vitest)
        run: npm run test -- --run
